# Orchard's consumed-artifact pin manifest. artifact-key -> { sha256, kind }.
# Every input Orchard bakes is listed here; the bake verifies each file's sha256 against this
# before use and REFUSES on mismatch/absence. kind = "binary" (fetched, staged) | "source"
# (vendored, compiled per-bake) | "config" (fetched, rendered-from: the service-manifest TOML).
# Bump a sha when the owning repo republishes (the pin-bump).
# INTEGRITY: this manifest is the UN-HASHED ROOT of the verify chain — it is NOT
# self-verifying by design. Its integrity rests on git review (the pin-bump diff) + the trust
# model: the operator builds all repos, so sha256 here = build-time integrity, dm-verity/IMA = runtime
# integrity, the ed25519 .img signature = whole-image authenticity (the documented install-time-TCB
# ceiling). "verify every input" has its root HERE, in review.
#
# Provenance: the shas are copied from the owning repos' committed published-pins.toml —
#   recipes/published-pins.toml (recipes-app, recipes-admin, service-manifest),
#   fruit-basket/published-pins.toml (fb-* + box-init/initramfs-init + rambutan/fb-manifest source),
#   seed-vault/published-pins.toml (grape, dragonfruit source),
#   creatine/published-pins.toml (creatine-serve), epa/published-pins.toml (epa),
#   dha/published-pins.toml (dha-orchestrator) — the real dha-box-integration binaries, built via
#   each repo's own build-musl.sh and published via grocer (sovereignty gates + ELF/linkage-asserted
#   inline at build; grocer's own fail-closed key+kind cross-check at publish). Regenerate the
#   artifacts via each repo's `make publish`; re-pin here on a republish.
schema-version = 1

[artifacts.box-init]
kind = "binary"
sha256 = "d501b49a198d924bb7e756fdeb9115330228f442334a93e8e6f02355e7b6a748"

