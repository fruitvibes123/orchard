# Required kernel CONFIG symbols — the build-time assertion (mirrors the deployment-overhaul
# spec's build-pipeline CONFIG-assertion block). Checked against the produced `.config` after
# `make olddefconfig`, asserted Rust-side after the container build returns (post-`make bzImage`);
# pre-`make` placement is the standing L-2 debt. Catches the silent-drop regression class:
# an audit round found a non-existent `CONFIG_LOCK_DOWN_KERNEL=y` that olddefconfig silently dropped,
# leaving lockdown (defense layer 5) absent for 7 audit rounds.
#
# exact_match: the `.config` line must match exactly (e.g. `CONFIG_IMA=y`). A `=n` entry asserts
# the symbol is DISABLED — kconfig writes that as `# CONFIG_X is not set`, never `CONFIG_X=n`, so
# the assertion accepts that canonical form (the spec's literal `grep -qx "^CONFIG_X=n$"` would
# never match a real .config — see kernel.rs).
exact_match = [
    # --- security / defense-by-composition (spec: defense layers 4/5/6) ---
    "CONFIG_SECURITY_LOCKDOWN_LSM=y",
    "CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y",
    "CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y",
    "CONFIG_MODULES=n",
    "CONFIG_IMA=y",
    "CONFIG_IMA_APPRAISE=y",
    "CONFIG_IMA_APPRAISE_REQUIRE_POLICY_SIGS=y",
    "CONFIG_IMA_LOAD_X509=y",
    # The cert PATHS the kernel reads at init (ima_init.c:109 / evm_main.c:1109). Pinned (audit I-4)
    # so a kernel default-drift away from where the initramfs places the leaf DERs
    # (build_tools_host.rs build_initramfs) is caught at the CONFIG-assert gate, not at QEMU boot.
    # Defaults VERIFIED == these values vs the pinned 6.18.33 source (ima/Kconfig:289, evm/Kconfig:74)
    # and the emitted .config; the assertion is exact-line, hence the embedded quotes.
    'CONFIG_IMA_X509_PATH="/etc/keys/x509_ima.der"',
    "CONFIG_EVM=y",
    "CONFIG_EVM_LOAD_X509=y",
    'CONFIG_EVM_X509_PATH="/etc/keys/x509_evm.der"',
    # The keyring link-restriction chain (audit M-1 R4). INTEGRITY_TRUSTED_KEYRING is what INSTALLS
    # restrict_link_by_digsig_builtin on .ima/.evm — i.e. the rule that rejects any key not chaining
    # to the operator CA on .builtin_trusted_keys (the heart of appraisal trust). It is default-y but
    # depends on the other three; the fragment declares all four, but WITHOUT pinning them a silent
    # olddefconfig drop (the demonstrated R8 class — REQUIRE_POLICY_SIGS was dropped via this very
    # chain) would leave the keyrings UNRESTRICTED with no build-time signal. All four are =y in the
    # validated .config (verified byte-exact), so a good build still passes.
    "CONFIG_INTEGRITY_SIGNATURE=y",
    "CONFIG_INTEGRITY_ASYMMETRIC_KEYS=y",
    "CONFIG_SYSTEM_TRUSTED_KEYRING=y",
    "CONFIG_INTEGRITY_TRUSTED_KEYRING=y",
    "CONFIG_SECURITY_YAMA=y",
    "CONFIG_BPF_JIT=n",
    # CONFIG_INITRAMFS_PRESERVE_XATTRS (in the spec's list) REMOVED — it is a PHANTOM symbol,
    # absent from mainline 6.18.33 (grep -rl over the whole tree: zero hits). R8 class
    # CONFIG-list correction. (initramfs cpio xattr handling is not gated by this symbol.)
    # --- functional FS / device-mapper (CONFIG_MODULES=n → must be built-in) ---
    "CONFIG_EXT4_FS=y",
    "CONFIG_SQUASHFS=y",
    "CONFIG_SQUASHFS_XZ=y",
    # kernel can't see the IMA sigs -> layer 6 silently fails). depends on SQUASHFS (present).
    "CONFIG_SQUASHFS_XATTR=y",
    "CONFIG_TMPFS=y",
    "CONFIG_TMPFS_POSIX_ACL=y",
    "CONFIG_DM_VERITY=y",
    "CONFIG_BLK_DEV_DM=y",
    "CONFIG_BLK_DEV_LOOP=y",
    "CONFIG_NET=y",
    "CONFIG_INET=y",
    # refuse autoconfig at runtime) — NOT compiled out, because the inet-table ip6/icmpv6 nft rule would
    # then fail nft -f, and nftables-load is the one OnFailure::Reboot oneshot → boot-loop. Inherited from
    # the Alpine linux-virt base today; force-set in kernel-hardening.config, so a base drift to =n/=m
    # self-heals silently and only an olddefconfig or dependency drop aborts at the pin gate.
    "CONFIG_IPV6=y",
    "CONFIG_NETFILTER=y",
    "CONFIG_NF_TABLES=y",
    "CONFIG_VIRTIO_NET=y",
    "CONFIG_VIRTIO_BLK=y",
    # --- kvm-clock / paravirt clocksource (M-2, network-bringup holistic R2) ---
    # having KVM_GUEST + PARAVIRT_CLOCK → a drift-free kvm-clock clocksource by construction; the ACME
    # `--min-epoch` issuance gate leans on kvm-clock supplying correct wall-time before ntpd steps. Both
    # were inherited UNPINNED from the Alpine linux-virt base. Both are force-set in
    # kernel-hardening.config, so a base drift self-heals silently; the pin aborts only on an
    # olddefconfig or dependency drop (the QEMU/KVM boot-gate wouldn't catch a guest-CONFIG regression
    # — kvm-clock is present there regardless). KVM_GUEST=y selects PARAVIRT_CLOCK; both are asserted.
    "CONFIG_KVM_GUEST=y",
    "CONFIG_PARAVIRT_CLOCK=y",
    # --- disk transports (C3 portability, audit L-1): pin the boot-disk drivers a KVM hypervisor may
    #     present — virtio-scsi / NVMe / emulated SATA-AHCI, plus the shared SCSI midlayer + sd driver
    #     (virtio-blk is CONFIG_VIRTIO_BLK above). The vps-kvm USB shed is USB-ONLY so these STAY;
    #     force-set in kernel-hardening.config, so a base drift that drops a transport self-heals
    #     silently and the pin here aborts only on an olddefconfig or dependency drop.
    #     SHARED — both substrates (bare-metal boots off a SATA / USB-storage disk on the same sd stack).
    "CONFIG_SCSI=y",
    "CONFIG_BLK_DEV_SD=y",
    "CONFIG_SCSI_VIRTIO=y",
    "CONFIG_ATA=y",
    "CONFIG_SATA_AHCI=y",
    "CONFIG_BLK_DEV_NVME=y",
    "CONFIG_NVME_CORE=y",
    # ONE plain kernel serves BOTH firmwares. EFI/EFI_STUB make the bzImage a PE the
    # rambutan loader can LoadImage (and the firmware re-verify vs db under SB); they
    # are bootability pins, NOT a boot-policy carrier — policy lives in the signed
    # loader. The four console symbols are the UEFI tty0 chain (firmware framebuffer →
    # simpledrm → fbcon) so a halted verified boot is DIAGNOSABLE on a screen;
    # the Alpine linux-virt base (verified in the pinned 6.18.34 .config); pinning
    # Harmless on SeaBIOS (EFI stub dormant; fbcon already in use).
    "CONFIG_EFI=y",
    "CONFIG_EFI_STUB=y",
    "CONFIG_SYSFB=y",
    "CONFIG_SYSFB_SIMPLEFB=y",
    "CONFIG_DRM_SIMPLEDRM=y",
    "CONFIG_FRAMEBUFFER_CONSOLE=y",
    "CONFIG_PROC_FS=y",
    "CONFIG_SYSFS=y",
    "CONFIG_DEVTMPFS=y",
    "CONFIG_DEVTMPFS_MOUNT=y",
    "CONFIG_PRINTK=y",
    # --- cgroup-v2 memory controller (dha AI-tenant confinement — the C1 keystone, §4.0) ---
    # The box's MODULES=n from-source kernel must SHIP the cgroup-v2 memory controller: the whole
    # dha-tenant memory defense reduces to one root-owned `dha/memory.max=Σ` ceiling, which cannot
    # exist without it. Inherited UNPINNED from the Alpine linux-virt base; force-set in
    # kernel-hardening.config so a base drift to =n self-heals silently and the pin aborts only on an
    # olddefconfig or dependency drop (dha box-integration spec §4.0 / §3 kernel-capability dependency). PIDS
    # backs the per-job work/<id> pids.max; SWAP backs the swapless `memory.swap.max=0` belt — swap
    # accounting is automatic under MEMCG+SWAP, so the separate memcg-swap controller symbol (removed
    # ~5.8, commit e55b9f96) is deliberately ABSENT: pinning that phantom would fail this very assert.
    "CONFIG_CGROUPS=y",
    "CONFIG_MEMCG=y",
    "CONFIG_CGROUP_PIDS=y",
    "CONFIG_SWAP=y",
    # --- R.4 reproducibility: the kernel-determinism assumption (audit R1 M-1). The repro design
    #     assumes latent_entropy is the ONLY build randomness AND randstruct is OFF. Both are force-set
    #     in kernel-hardening.config, so a base drift (latent_entropy off, or randstruct flipped to
    #     FULL/PERFORMANCE) self-heals silently with NO signal: for the RANDSTRUCT_NONE choice member
    #     the appended NONE=y reads last and wins (confdata last-one-wins), so the pin still passes.
    #     The pin aborts only on an olddefconfig or dependency drop; the fragment<->pins consistency
    #     test covers a fragment edit.
    "CONFIG_GCC_PLUGIN_LATENT_ENTROPY=y",
    "CONFIG_RANDSTRUCT_NONE=y",
    # C3 substrate split: the 4 USB boot-media drivers are per-substrate, NOT in this shared block
    # (kernel-config-pins-baremetal.toml asserts them =y, kernel-config-pins-vpskvm.toml forbids them +
    # fail-closes the CONFIG_USB prefix). USB-only — the DISK transports (SCSI/ATA/NVMe/BLK_DEV_SD)
    # are force-set + PINNED in this shared block above (the disk-transports group, audit L-1) so a
    # base drift can't silently drop one, keeping the box bootable on any KVM hypervisor's disk. The
    # bake unions the shared block with the firmware-derived substrate block.
]

# prefix_match: string-valued symbols with per-build content (a key path) — the `.config` must
# contain a line STARTING with the prefix. CONFIG_SYSTEM_TRUSTED_KEYS embeds the operator's CA cert
# into `.builtin_trusted_keys` (the CA vouches for the IMA/EVM leaves); a silent drop (bad path syntax,
# missing trailing quote) leaves the leaves unable to link onto `.ima`/`.evm` → appraisal fails → lockout
prefix_match = [
    'CONFIG_SYSTEM_TRUSTED_KEYS="',
]

# observe_exact: symbols asserted in the produced .config post-olddefconfig with NO line in any
# hardening fragment. Observed, not force-set — the fragment never repairs them, so a base or
# olddefconfig drift that drops one fails the build for review (refs H-1).
# Same match semantics and message as exact_match.
observe_exact = [
    # 17 exploit-mitigation symbols.
    "CONFIG_RANDOMIZE_BASE=y",
    "CONFIG_RANDOMIZE_MEMORY=y",
    "CONFIG_STACKPROTECTOR_STRONG=y",
    "CONFIG_FORTIFY_SOURCE=y",
    "CONFIG_HARDENED_USERCOPY=y",
    "CONFIG_SLAB_FREELIST_RANDOM=y",
    "CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y",
    "CONFIG_MITIGATION_PAGE_TABLE_ISOLATION=y",
    "CONFIG_MITIGATION_RETPOLINE=y",
    "CONFIG_STRICT_KERNEL_RWX=y",
    "CONFIG_VMAP_STACK=y",
    "CONFIG_LEGACY_VSYSCALL_NONE=y",
    "CONFIG_STRICT_DEVMEM=y",
    "CONFIG_IO_STRICT_DEVMEM=y",
    "CONFIG_SECURITY_DMESG_RESTRICT=y",
    "CONFIG_ZERO_CALL_USED_REGS=y",
    "CONFIG_BPF_UNPRIV_DEFAULT_OFF=y",
    # LSM string pinned verbatim as produced. A name in the list does not imply the LSM is built
    # or active.
    'CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity"',
]
