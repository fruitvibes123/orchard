#
# `bake_boot_fs`/`bake_persist_skeleton` pass `MKE2FS_CONFIG=<this file>` so the ext4 LAYOUT is
# governed here, NOT by the build container's `/etc/mke2fs.conf` — which could drift on a container
# rebuild (different e2fsprogs default features → a different layout → broken byte-reproducibility).
#
# This is a VERBATIM copy of e2fsprogs 1.47.3's default (the pinned `e2fsprogs=1.47.3-r0` in the
# Containerfile) — the exact config the B1 spike used to produce its byte-reproducible, boot-proven
# boot-fs. Pinning it (rather than hand-trimming to a "minimal" set) keeps the proven on-disk layout
# while removing the cross-container-version variable. The per-bake reproducibility knobs ride the
# command line instead (`-b 4096 -U <fixed-uuid> -E hash_seed=<fixed>,lazy_itable_init=0,
# lazy_journal_init=0 -O ^has_journal`), so they are visible at the call site.
#
# Re-sync only on a deliberate e2fsprogs bump (then re-run the byte-reproducibility gate).

[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext3 = {
		features = has_journal
	}
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,metadata_csum_seed,64bit,dir_nlink,extra_isize,orphan_file
	}
	small = {
		blocksize = 1024
		inode_ratio = 4096
	}
	floppy = {
		blocksize = 1024
		inode_ratio = 8192
	}
	big = {
		inode_ratio = 32768
	}
	huge = {
		inode_ratio = 65536
	}
	news = {
		inode_ratio = 4096
	}
	largefile = {
		inode_ratio = 1048576
		blocksize = -1
	}
	largefile4 = {
		inode_ratio = 4194304
		blocksize = -1
	}
	hurd = {
	     blocksize = 4096
	     inode_size = 128
	     warn_y2038_dates = 0
	}
