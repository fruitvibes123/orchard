# Keys are random; tests bind to these committed bytes, not to gen.sh determinism.
# All key + sig creation times are stamped at gen_time (--faked-system-time); tests evaluate
# the generated corpus at fixture_now (> gen_time, so nothing is future-dated; key_d's subkey
# is expired by then). The REAL fixtures under real/ share the same fixture_now (METADATA.toml).
gen_time    = 1781000000
fixture_now = 1781100000
leading_zero_mpi_tries      = 98
leading_zero_time_offset_s  = 98   # winning sig created at gen_time + this
expiring_sig_lifetime_s     = 3600   # sig_a_1b_sha256_expiring: expired at fixture_now

